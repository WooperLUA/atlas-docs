<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Framework - Documentation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
     <style>
        :root {
            --primary:    #2ec4b6; /* Azure hint */
            --bg:         #262626;
            --text:       #e2e8f0;
            --sidebar-bg: #232323;
            --code-bg:    #232323;
            --border:     #373737;
            --accent:     #58f3e5; /* Lighter azure/sky */
            --azure-glow: rgba(46, 196, 182, 0.2);
        }

        body {
            margin: 0;
            line-height: 1.6;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        #app {
            display: flex;
            min-height: 100vh;
        }

        button{
            border-radius: 16px;
            background-color: var(--border);
            color: var(--text);
            cursor : pointer;
            border: none;
            padding: 16px;
            transition : all 0.2s ease-in-out;
            scale: 1;
        }

        button:hover {
            scale: 1.05;
            filter: brightness(130%);
        }

        button:active {
            scale: .90;
        }

        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-shadow: 0 0 10px var(--azure-glow);
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar nav li {
            margin-bottom: 0.5rem;
        }

        .sidebar nav a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .sidebar nav a:hover {
            background: var(--azure-glow);
            color: var(--accent);
        }

        .sidebar nav a.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 15px var(--azure-glow);
        }

        .content {
            flex: 1;
            padding: 3rem 5rem;
            max-width: 1000px;
        }

        pre {
            background-color: var(--code-bg) !important;
            padding: 1.5rem;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 1.5rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        code {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            background: transparent !important;
        }

        p code {
            background-color: var(--code-bg) !important;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--accent);
        }

        h1 { font-size: 3rem; margin-top: 0; color: var(--accent); }
        h2 { font-size: 2rem; margin-top: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        h3 { font-size: 1.5rem; margin-top: 2rem; }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .feature-card {
            padding: 1.5rem;
            border-radius: 12px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
        }

        .feature-card h3 { margin-top: 0; color: var(--accent); }

        .api-item {
            margin-bottom: 2rem;
            padding-left: 1rem;
            border-left: 4px solid var(--primary);
        }

        .api-item code {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: inherit;
            font-weight: 600;
            color: var(--accent);
            display: block;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            #app { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; }
            .content { padding: 2rem; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
